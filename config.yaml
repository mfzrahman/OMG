# OMG API Gateway — default configuration.
# All values can be overridden by environment variables.
# Routes defined here are seeded into the database on first startup.

server:
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 15s

log:
  level: info          # debug | info | warn | error

database:
  path: omg.db

gateway:
  load_balancer: round_robin  # round_robin | least_conn
  circuit_breaker:
    threshold: 5              # consecutive failures to open circuit
    cooldown: 30s             # time before testing half-open
    half_open_max: 1          # max probes in half-open state

# Example routes (optional — use admin API to manage routes at runtime).
routes: []
